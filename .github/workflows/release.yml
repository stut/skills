name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Push as the repo admin (via PAT) so pushes to the protected
          # default branch pass the ruleset's admin-role bypass. The default
          # GITHUB_TOKEN authenticates as the GitHub Actions app, which cannot
          # be a bypass actor on a personal repo, so its pushes are rejected.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute versions
        id: versions
        run: |
          set -euo pipefail
          current=$(jq -r '.version' .claude-plugin/plugin.json)
          echo "Current version: $current"

          IFS='.' read -r major minor patch <<< "$current"

          case "${{ inputs.bump }}" in
            major)
              major=$((major + 1)); minor=0; patch=0 ;;
            minor)
              minor=$((minor + 1)); patch=0 ;;
            patch)
              patch=$((patch + 1)) ;;
          esac

          release="${major}.${minor}.${patch}"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Release version: $release"

      - name: Set release version in plugin.json
        run: |
          set -euo pipefail
          jq --tab --arg v "${{ steps.versions.outputs.release }}" '.version = $v' \
            .claude-plugin/plugin.json > plugin.tmp && mv plugin.tmp .claude-plugin/plugin.json

      - name: Commit, tag, and push release
        run: |
          set -euo pipefail
          git add .claude-plugin/plugin.json
          git commit -m "Release v${{ steps.versions.outputs.release }}"
          git tag "v${{ steps.versions.outputs.release }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "v${{ steps.versions.outputs.release }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.versions.outputs.release }}" \
            --title "v${{ steps.versions.outputs.release }}" \
            --generate-notes
