name: Release

on:
  # Every merge to main ships to users (the marketplace serves the branch HEAD),
  # so every merge must bump the version — auto-release a minor bump. Changes
  # under .github/ don't affect the published plugin, so they don't trigger one.
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
  # Manual runs pick the bump — for the rare major or patch release.
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part to bump (manual runs only; merges auto-bump minor)'
        required: true
        default: 'minor'
        type: choice
        options:
          - minor
          - patch
          - major

permissions:
  contents: write

# Serialize releases so concurrent merges don't race on the version/tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Always work from the latest main tip, not the triggering commit, so a
          # queued run reads the version the previous release just wrote.
          ref: main
          # Push as the repo admin (via PAT) so pushes to the protected default
          # branch pass the ruleset's admin-role bypass. The default GITHUB_TOKEN
          # authenticates as the GitHub Actions app, which cannot be a bypass
          # actor on a personal repo, so its pushes are rejected.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute versions
        id: versions
        run: |
          set -euo pipefail
          current=$(jq -r '.version' .claude-plugin/plugin.json)
          echo "Current version: $current"

          # Merges to main auto-release a minor bump; manual runs pick the bump.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bump="${{ inputs.bump }}"
          else
            bump="minor"
          fi
          echo "Bump: $bump"

          IFS='.' read -r major minor patch <<< "$current"
          case "$bump" in
            major)
              major=$((major + 1)); minor=0; patch=0 ;;
            minor)
              minor=$((minor + 1)); patch=0 ;;
            patch)
              patch=$((patch + 1)) ;;
          esac

          release="${major}.${minor}.${patch}"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Release version: $release"

      - name: Set release version in plugin.json
        run: |
          set -euo pipefail
          jq --tab --arg v "${{ steps.versions.outputs.release }}" '.version = $v' \
            .claude-plugin/plugin.json > plugin.tmp && mv plugin.tmp .claude-plugin/plugin.json

      - name: Commit, tag, and push release
        run: |
          set -euo pipefail
          git add .claude-plugin/plugin.json
          # [skip ci] so this release commit's push doesn't re-trigger the workflow.
          git commit -m "Release v${{ steps.versions.outputs.release }} [skip ci]"
          git tag "v${{ steps.versions.outputs.release }}"
          git push origin "HEAD:main"
          git push origin "v${{ steps.versions.outputs.release }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.versions.outputs.release }}" \
            --title "v${{ steps.versions.outputs.release }}" \
            --generate-notes
